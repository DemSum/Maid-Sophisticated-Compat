name: Publish to Modrinth and CurseForge

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build release JAR
        run: >
          ./gradlew build
          --no-daemon
          -Pmod_version=${{ steps.version.outputs.value }}

      - name: Publish release
        uses: Kira-NT/mc-publish@v3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          files: |
            build/libs/!(*-@(dev|sources|javadoc)).jar

          name: Maid Sophisticated Compat ${{ steps.version.outputs.value }}
          version: ${{ steps.version.outputs.value }}
          version-type: ${{ github.event.release.prerelease && 'beta' || 'release' }}
          changelog: ${{ github.event.release.body }}

          loaders: |
            neoforge

          game-versions: |
            1.21.1

          java: |
            21

          environment: client | server

          modrinth-dependencies: |
            touhou-little-maid(required)
            maidsoul-kitchen(optional)
            sophisticated-storage(optional)
            sophisticated-backpacks(optional)
            create-enchantment-industry(optional)

          curseforge-dependencies: |
            touhou-little-maid(required)
            maidsoul-kitchen(optional)
            sophisticated-storage(optional)
            sophisticated-backpacks(optional)
            create-enchantment-industry(optional)

          retry-attempts: 3
          retry-delay: 10000
          fail-mode: fail
